      th,

        font-size: 10px;

    var grp = 'Начинающие до 850 РШТ';
    var col = 'rt';
    var asc = false;
    var waitingGroupName = 'Ожидающие участия';

    function sortBy(column) {
      if (col === column) {
        asc = !asc;
      } else {
        col = column;
        asc = false;
      }

      render();
    }

    function filter(group) {
      grp = group;

      if (grp === waitingGroupName) {
        col = 'createdAtTs';
        asc = true;
      } else {
        col = 'rt';
        asc = false;
      }

      render();
    }

    function render() {
      var header =
        document.getElementById('hdr');

      if (grp === waitingGroupName) {
        header.innerHTML = [
          '<th>#</th>',
          '<th onclick="sortBy(\'fullName\')">ФИО</th>',
          '<th onclick="sortBy(\'birth\')">Год рожд.</th>',
          '<th onclick="sortBy(\'createdAtTs\')">Дата заявки</th>'
        ].join('');
      } else {
        header.innerHTML = [
          '<th>#</th>',
          '<th onclick="sortBy(\'fullName\')">ФИО</th>',
          '<th onclick="sortBy(\'id\')">ID</th>',
          '<th onclick="sortBy(\'birth\')">Год рожд.</th>',
          '<th onclick="sortBy(\'rt\')">Рейтинг</th>'
        ].join('');
      }

      var body =
        document.querySelector('#tab tbody');

      body.innerHTML = '';

      var filtered = data.filter(function(player) {
        return player.group === grp;
      });

      if (grp === waitingGroupName) {
        document.getElementById('avg').textContent =
          'Количество заявок в ожидании: ' +
          filtered.length;
      } else {
        var sum = 0;
        var count = 0;

        filtered.forEach(function(player) {
          var rating =
            parseFloat(player.rt);

          if (!isNaN(rating)) {
            sum += rating;
            count++;
          }
        });

        var average =
          count
            ? Math.round(sum / count)
            : 0;

        document.getElementById('avg').textContent =
          'Средний рейтинг группы: ' +
          average +
          ' (участников: ' +
          filtered.length +
          ')';
      }

      filtered.sort(function(a, b) {
        var valueA = a[col] || '';
        var valueB = b[col] || '';

        if (col === 'createdAtTs') {
          var timeA =
            parseFloat(valueA) || 0;

          var timeB =
            parseFloat(valueB) || 0;

          return asc
            ? timeA - timeB
            : timeB - timeA;
        }

        var numberA =
          parseFloat(valueA);

        var numberB =
          parseFloat(valueB);

        if (
          !isNaN(numberA) &&
          !isNaN(numberB)
        ) {
          return asc
            ? numberA - numberB
            : numberB - numberA;
        }

        if (valueA < valueB) {
          return asc ? -1 : 1;
        }

        if (valueA > valueB) {
          return asc ? 1 : -1;
        }

        return 0;
      });

      filtered.forEach(function(player, index) {
        if (grp === waitingGroupName) {
          body.insertAdjacentHTML(
            'beforeend',
            '<tr>' +
              '<td>' + (index + 1) + '</td>' +
              '<td>' + (player.fullName || '') + '</td>' +
              '<td>' + (player.birth || '') + '</td>' +
              '<td>' + (player.createdAt || '') + '</td>' +
            '</tr>'
          );
        } else {
          body.insertAdjacentHTML(
            'beforeend',
            '<tr>' +
              '<td>' + (index + 1) + '</td>' +
              '<td>' + (player.fullName || '') + '</td>' +
              '<td>' + (player.id || '') + '</td>' +
              '<td>' + (player.birth || '') + '</td>' +
              '<td>' + (player.rt || '') + '</td>' +
            '</tr>'
          );
        }
      });
    }

    window.onload = render;
  </script>
